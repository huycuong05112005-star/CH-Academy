  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- SEO -->
    <title>CH Academy - Hệ thống Quản lý Trung tâm Giáo dục</title>
    <meta name="description" content="CH Academy - Nền tảng quản lý trung tâm giáo dục toàn diện. Quản lý học viên, lớp học, giáo viên và học phí trong một hệ thống tích hợp." />
    <meta name="keywords" content="CH Academy, trung tâm giáo dục, quản lý học viên, học online, quản lý lớp học" />
    <meta name="robots" content="index, follow" />
    <!-- Fonts: Be Vietnam Pro & Inter for Vietnamese Typography Excellence -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Open Graph -->
    <meta property="og:title" content="CH Academy - Hệ thống Quản lý Trung tâm Giáo dục" />

    <meta property="og:type" content="website" />

    <!-- Immediate theme bootstrap to eliminate Flash of Unstyled Theme -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('ch_academy_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && systemDark) || (stored === 'system' && systemDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
