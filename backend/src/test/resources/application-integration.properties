# ===================================================
# CH Academy - Integration Test Profile (PostgreSQL)
# ===================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ch_academy}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ch_academy_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ch_academy_dev_2024}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.encoding=UTF-8
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

logging.level.vn.chacademy=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO

app.jwt.secret=${JWT_SECRET:chAcademySuperSecretKeyForJwtAuthenticationInDevModeOnlyMin256BitsLong2024}
app.jwt.expiration-ms=86400000
