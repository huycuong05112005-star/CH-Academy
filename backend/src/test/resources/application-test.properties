# Cấu hình đặc biệt cho kiểm thử - dùng H2 in-memory thay vì PostgreSQL
# File này tự động được dùng khi chạy test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Tắt Flyway trong test - JPA sẽ tự tạo bảng từ Entity
spring.flyway.enabled=false

logging.level.vn.chacademy=DEBUG
logging.level.org.springframework.web=DEBUG

app.jwt.secret=chAcademySuperSecretKeyForJwtAuthenticationInDevModeOnlyMin256BitsLong2024
app.jwt.expiration-ms=86400000
