# ===========================
# CH Academy - Cấu hình môi trường Dev
# ===========================

spring.application.name=ch-academy-backend

# ----- Server -----
server.port=${BACKEND_PORT:8080}

# ----- Database -----
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:ch_academy}
spring.datasource.username=${POSTGRES_USER:ch_academy_user}
spring.datasource.password=${POSTGRES_PASSWORD:ch_academy_dev_2024}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ----- JPA -----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ----- Flyway -----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ----- Actuator -----
management.endpoints.web.base-path=/api/v1/actuator
management.endpoint.health.show-details=always

# ----- Logging -----
logging.level.vn.chacademy=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO

# ----- CORS -----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
