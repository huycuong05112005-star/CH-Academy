# ===========================
# CH Academy - Cấu hình môi trường Dev
# ===========================

spring.application.name=ch-academy-backend

# ----- Server & Encoding -----
server.port=${BACKEND_PORT:8088}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true

# ----- Database -----
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:ch_academy}?characterEncoding=UTF-8
spring.datasource.username=${POSTGRES_USER:ch_academy_user}
spring.datasource.password=${POSTGRES_PASSWORD:ch_academy_dev_2024}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-init-sql=SET CLIENT_ENCODING TO 'UTF8'

# ----- JPA -----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----- Flyway -----
spring.flyway.enabled=true
spring.flyway.encoding=UTF-8
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ----- Actuator -----
management.endpoints.web.base-path=/api/v1/actuator
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# ----- Logging -----
logging.level.vn.chacademy=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=INFO

# ----- CORS -----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ----- JWT Security -----
app.jwt.secret=${JWT_SECRET:chAcademySuperSecretKeyForJwtAuthenticationInDevModeOnlyMin256BitsLong2024}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ----- Java Mail (Gmail SMTP) -----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:nhc051105@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ----- File Upload & Storage -----
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads/materials
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

