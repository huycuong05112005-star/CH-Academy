name: End-to-End Tests (Playwright)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-e2e:
    name: Full E2E Portal & RBAC Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ch_academy_e2e
          POSTGRES_USER: e2e_user
          POSTGRES_PASSWORD: e2e_password_secure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Backend JAR
        run: |
          chmod +x backend/mvnw
          cd backend
          ./mvnw clean package -DskipTests=true -B

      - name: Start Backend in Background
        run: |
          nohup java -jar backend/target/*.jar \
            --spring.profiles.active=dev \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/ch_academy_e2e \
            --spring.datasource.username=e2e_user \
            --spring.datasource.password=e2e_password_secure \
            --server.port=8088 > backend.log 2>&1 &
          echo "Backend process launched in background."

      - name: Wait for Backend Health Check
        run: |
          echo "Awaiting backend readiness on port 8088..."
          for i in {1..40}; do
            if curl -s http://localhost:8088/api/v1/health | grep -q '"status":"UP"'; then
              echo "Backend is UP and healthy!"
              break
            fi
            echo "Waiting for Spring Boot... ($i/40)"
            sleep 3
          done

      - name: Install Frontend Dependencies & Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: |
          cd frontend
          npm run test:e2e

      - name: Print Backend Log on Failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          cat backend.log || true

      - name: Upload Playwright Test Report & Traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: frontend/playwright-report/
          retention-days: 14
