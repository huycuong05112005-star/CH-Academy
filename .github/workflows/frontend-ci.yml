name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Frontend Lint, Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: TypeScript Type Checking
        run: npx tsc -b --noEmit

      - name: Run Unit & Component Tests (Vitest)
        run: npm run test -- --run

      - name: Build Production Assets
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html is missing!"; exit 1; }
          echo "Production build verified successfully."

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-production-dist
          path: frontend/dist/
          retention-days: 7
